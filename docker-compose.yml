services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youtube_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: db-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  db-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: db-seed
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SEED_ADMIN_EMAIL:
      SEED_ADMIN_PASSWORD:
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      WORKER_ID: worker-primary
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
      CHANNEL_ACTIVE_UPLOAD_DAYS: ${CHANNEL_ACTIVE_UPLOAD_DAYS:-30}
      RSS_SCAN_MINUTES: ${RSS_SCAN_MINUTES:-15}
      CHANNEL_SCAN_HOURS: ${CHANNEL_SCAN_HOURS:-6}
      CHANNEL_HEALTH_HOURS: ${CHANNEL_HEALTH_HOURS:-6}
      PLAYWRIGHT_CONCURRENCY: ${PLAYWRIGHT_CONCURRENCY:-1}
      YTDLP_CONCURRENCY: ${YTDLP_CONCURRENCY:-2}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - egress

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      API_PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?DEPLOYMENT_MODE must be set}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?APP_ALLOWED_ORIGINS must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:?SESSION_IDLE_MINUTES must be set}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:?SESSION_ABSOLUTE_HOURS must be set}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:?LOGIN_MAX_ATTEMPTS must be set}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:?LOGIN_LOCK_MINUTES must be set}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-}
      GEMINI_ANALYSIS_MODEL: ${GEMINI_ANALYSIS_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      NVIDIA_FAST_MODEL: ${NVIDIA_FAST_MODEL:-}
      NVIDIA_ANALYSIS_MODEL: ${NVIDIA_ANALYSIS_MODEL:-}
      NVIDIA_LONG_CONTEXT_MODEL: ${NVIDIA_LONG_CONTEXT_MODEL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:?WORKER_HEARTBEAT_STALE_SECONDS must be set}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const socket=net.createConnection({host:'127.0.0.1',port:5000});const fail=()=>{socket.destroy();process.exit(1)};socket.setTimeout(2000,fail);socket.once('error',fail);socket.once('connect',()=>{socket.end();process.exit(0)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - database

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      WEB_PORT: 3000
      API_INTERNAL_URL: http://api:5000
    ports:
      - ${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const socket=net.createConnection({host:'127.0.0.1',port:3000});const fail=()=>{socket.destroy();process.exit(1)};socket.setTimeout(2000,fail);socket.once('error',fail);socket.once('connect',()=>{socket.end();process.exit(0)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["hosting"]
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    ports:
      - ${CADDY_HTTP_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:80
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    restart: "no"
    init: true
    environment:
      E2E_BASE_URL:
      E2E_ADMIN_EMAIL:
      E2E_ADMIN_PASSWORD:
      E2E_MATRIX_VIEWER_EMAIL:
      E2E_MATRIX_VIEWER_UPDATED_EMAIL:
      E2E_MATRIX_VIEWER_PASSWORD:
      E2E_MATRIX_VIEWER_RESET_PASSWORD:
      E2E_LOGOUT_VIEWER_EMAIL:
      E2E_LOGOUT_VIEWER_PASSWORD:
      E2E_CHANGE_VIEWER_EMAIL:
      E2E_CHANGE_VIEWER_PASSWORD:
      E2E_CHANGE_VIEWER_NEW_PASSWORD:
      E2E_BROWSER_VIEWER_EMAIL:
      E2E_BROWSER_VIEWER_PASSWORD:
      E2E_RAW_SESSION_TOKEN_MARKER:
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend: {}
  database:
    internal: true
  egress: {}
