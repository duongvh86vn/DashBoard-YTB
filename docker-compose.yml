services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youtube_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: db-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      WORKER_ID: worker-primary
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - egress

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      API_PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health/db').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - database

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_VERSION: 0.1.0
      WEB_PORT: 3000
      API_INTERNAL_URL: http://api:5000
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend: {}
  database:
    internal: true
  egress: {}
