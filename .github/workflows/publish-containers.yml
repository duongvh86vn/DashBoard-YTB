name: Publish prebuilt containers

on:
  push:
    branches:
      - main
      - phase/0-foundation
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/duongvh86vn/dashboard-ytb

jobs:
  verify:
    name: Typecheck, lint, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm verify

  build:
    name: Build ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            target: api
          - service: web
            target: web
          - service: worker
            target: worker
          - service: db-migrate
            target: db-migrate
          - service: db-seed
            target: db-seed

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/duongvh86vn/DashBoard-YTB
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=YouTube Home Monitor ${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

  promote:
    name: Promote complete image set
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify anonymous pull access
        shell: bash
        run: |
          set -euo pipefail
          for service in api web worker db-migrate db-seed; do
            docker buildx imagetools inspect \
              "${IMAGE_PREFIX}-${service}:sha-${GITHUB_SHA}" >/dev/null
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote foundation branch
        if: github.ref == 'refs/heads/phase/0-foundation'
        shell: bash
        run: |
          set -euo pipefail
          for service in api web worker db-migrate db-seed; do
            image="${IMAGE_PREFIX}-${service}"
            docker buildx imagetools create \
              --tag "${image}:phase-0-foundation" \
              "${image}:sha-${GITHUB_SHA}"
          done

      - name: Promote main branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for service in api web worker db-migrate db-seed; do
            image="${IMAGE_PREFIX}-${service}"
            docker buildx imagetools create \
              --tag "${image}:main" \
              --tag "${image}:latest" \
              "${image}:sha-${GITHUB_SHA}"
          done

      - name: Promote release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          for service in api web worker db-migrate db-seed; do
            image="${IMAGE_PREFIX}-${service}"
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              "${image}:sha-${GITHUB_SHA}"
          done
